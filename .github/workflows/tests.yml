name: Portable unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run synthetic portable checks (no weights or market data)
        run: |
          python -m unittest discover -s tests -p test_readiness.py -v
          python -m unittest discover -s tests -p test_paper.py -v
          python -m unittest discover -s tests -p test_diagnosis.py -v
          python -m unittest discover -s tests -p test_release.py -v
