[project]
name = "epf"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas", "pyarrow", "numpy", "scipy", "scikit-learn", "lightgbm", "requests",
    "holidays", "torch", "chronos-forecasting>=2.2", "peft", "matplotlib", "huggingface-hub",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
